name: Must-read check

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  urgent-check:
    runs-on: ubuntu-latest
    env:
      AULA_MITID_USERNAME: ${{ secrets.AULA_MITID_USERNAME }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      - name: Restore MitID token cache
        env:
          AULA_TOKENS_JSON: ${{ secrets.AULA_TOKENS_JSON }}
        run: |
          mkdir -p ~/.config/aula
          echo "$AULA_TOKENS_JSON" > ~/.config/aula/tokens.json

      - name: Run must-read check
        run: uv run python -m instant_aula.urgent_check

      # See weekly-digest.yml for why this happens unconditionally.
      - name: Persist refreshed MitID token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: gh secret set AULA_TOKENS_JSON --body "$(cat ~/.config/aula/tokens.json)"

      # Runners are ephemeral -- state/state.json must live in git to
      # persist the must-read dedup tracking across runs.
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state/state.json; then
            git add state/state.json
            git commit -m "Update must-read state [skip ci]"
            git push
          fi
