[project]
name = "instant-aula"
version = "0.1.0"
description = "Weekly digest + must-read alerts from Aula, by email"
requires-python = ">=3.14"
dependencies = [
    "aula>=1.7.0",
    "httpx>=0.28.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instant_aula"]
