name: Debug Meebook fetch

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      - name: Restore MitID token cache
        env:
          AULA_TOKENS_JSON: ${{ secrets.AULA_TOKENS_JSON }}
        run: |
          mkdir -p ~/.config/aula
          echo "$AULA_TOKENS_JSON" > ~/.config/aula/tokens.json

      - name: Runner network info
        run: |
          echo "=== public IP / geo (ipinfo.io) ==="
          curl -s https://ipinfo.io || true

      - name: Raw diagnostic query (max verbosity)
        env:
          AULA_MITID_USERNAME: ${{ secrets.AULA_MITID_USERNAME }}
        run: |
          uv run aula --username "$AULA_MITID_USERNAME" --output json -vv weekly-summary --provider meebook --week 2026-W36 > /tmp/out.json 2> /tmp/err.log
          echo "=== STDERR (full debug log) ==="
          cat /tmp/err.log
          echo "=== meebook_weekplan from stdout ==="
          python3 -c "import json; d=json.load(open('/tmp/out.json')); print(json.dumps(d.get('meebook_weekplan'), indent=2))"

      - name: Persist refreshed MitID token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: gh secret set AULA_TOKENS_JSON --body "$(cat ~/.config/aula/tokens.json)"
