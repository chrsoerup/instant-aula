name: "Instant Aula"
version: "1.5.0"
slug: "instant_aula"
description: "Weekly Aula school digest, urgent alerts and a school-events calendar for Home Assistant"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
homeassistant_api: true
map:
  - homeassistant_config:rw
options:
  aula_mitid_username: ""
  aula_auth_method: "app"
  aula_mitid_password: ""
  ha_notify_service: ""
  ha_calendar_entity: ""
  school_feed_child: ""
  run_mitid_login: false
  run_now: "none"
schema:
  aula_mitid_username: "str"
  aula_auth_method: "list(app|token)"
  aula_mitid_password: "password?"
  ha_notify_service: "str"
  ha_calendar_entity: "str?"
  school_feed_child: "str?"
  run_mitid_login: "bool"
  run_now: "list(none|urgent|digest|calendar|both)"
